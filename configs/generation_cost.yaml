# 發電成本表（v_generation_cost）的層級人工裁決。
#
# 為什麼需要這一份：「發電方式」欄把整體加權平均、兩個小計、上層分類與最細明細**混在
# 同一欄**，資料本身沒有任何層級標記。2025 年共 24 列，其中 6 列是彙總。一覽式的問句
# （「各種發電方式成本」）若照原樣列出，使用者會把「火力發電 2.67」與「燃煤 2.20」
# 「燃氣 2.76」「燃油 6.69」當成四種並列的發電方式 —— 前者其實是後三者的彙總。
#
# 這個層級關係**無法從資料驗算**：表裡只有每度成本，沒有發電量權重，無法用明細回推
# 彙總值。所以下面是一次人工裁決，不是推導結果 —— 與 renewable_overrides.yaml 同一
# 條原則：程式不猜測，處理不了的寫在這裡並附上依據。
#
# 資料換版後若出現新的彙總名稱，要一併補進來。漏掉的代價是它會被當成明細列出去。

# 一覽式問句要排除的列。指名去問其中任何一個，仍然答得出來。
aggregate_rows:
  # 電力來源=整體。全部自發與購入的加權平均，與任何單一發電方式都不同層。
  - 平均發購電成本

  # 電力來源=自發電力／購入電力 各自的小計列。
  - 自發電力小計
  - 購入電力小計

  # 依據：台電決算成本表的分類，火力發電下分燃煤、燃氣、燃油三項。
  # 2025 年自發電力的「火力發電」2.67 與「自發電力小計」2.67 同值，
  # 也說明它是一個彙總層而不是一種並列的發電方式。
  - 火力發電

  # 依據：同一份分類，再生能源下分慣常水力、太陽光電、風力發電、地熱
  # （購入電力另有「其他再生能源」）。自發側叫「再生能源發電」、購入側叫「再生能源」。
  - 再生能源發電
  - 再生能源
