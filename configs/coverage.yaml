# 資料涵蓋說明：可以回答什麼、目前答不出什麼。
#
# 「涵蓋多少」由程式從資料庫查出來（期間、筆數、電廠數、燃料別、已知陷阱），
# 不寫在這裡 —— 那些數字會隨資料換版而變。
#
# 這個檔只放兩種算不出來的東西：
#   views       每個語意檢視「回答什麼問題」的一句話（schema 推不出用途）
#   limitations 目前答不出來的主題（「沒有什麼」無法從現有資料推導）
#
# 每條 limitation 必須附 `absent`：指定檢視不得出現的欄位關鍵字。一旦出現，
# 這條限制就不再成立，測試會失敗並要求更新說明。
# 過期的限制說明比沒有更糟 —— 它讓使用者相信一件不再為真的事。

views:
  v_system:
    title: 全系統每日供需
    answers: 尖峰負載、淨尖峰供電能力、備轉容量與備轉容量率，以及全系統的工業與民生用電。
  v_peak:
    title: 機組每日尖峰出力
    answers: 逐日、逐機組欄位的尖峰時刻出力，並標示該欄是單廠、彙總或殘差。
  v_unit:
    title: 機組主檔
    answers: 機組所屬電廠、燃料、縣市、裝置容量與商轉日期。
  v_outage:
    title: 歲修排程
    answers: 機組歲修的起訖日期、原因，以及該筆是否已確認到機組。
  v_generation_cost:
    title: 分發電方式的發電成本
    answers: 年度、發電方式與電力來源別的每度成本。
  v_re_generation:
    title: 再生能源場站發電量
    answers: 台電自建再生能源場站的逐月發電量與裝置容量。
  # 以下三張在 realtime.db（收集器寫入，不進受控資料版本）。問句帶「現在、今天、昨天」時才查它們。
  v_rt_now:
    title: 即時機組出力（最新時段）
    answers: 最新一個 10 分鐘時段各機組、各發電類型的淨出力、裝置容量與運轉備註。
  v_rt_10min:
    title: 即時機組出力（每 10 分鐘）
    answers: 最近 14 天每 10 分鐘的機組淨出力；可算今天到目前的估算發電量與一天內的變化。
  v_rt_daily:
    title: 即時機組每日彙總
    answers: 從開始收集那天起，每天每部機組的估算發電量、最高／平均／最低出力與資料完整度。

limitations:
  - topic: 收集開始以前的火力與核能發電量
    detail: >-
      每日資料記的是尖峰「時刻」的出力（萬瓩），不是一段期間累積的發電量（度）。
      即時資料能估算發電量，但只從收集器第一次執行那天開始；匯入台電 d006010 後可以往前補約三個月（晚約四個月、只有台電自有機組），更早的期間（例如「去年」）答不出來。
      再生能源場站有逐月發電量，但只涵蓋台電自建場站。
    # 用 _度 而不是 度：後者會命中「粒度」「商轉日期精度」。
    absent:
      v_peak: ["發電量", "_度"]
      v_unit: ["發電量", "_度"]
  - topic: 分電廠或分用戶的用電
    detail: >-
      用電只有全系統的工業與民生兩個數字（百萬度），沒有分電廠、分縣市或分用戶類別的耗電資料。
    absent:
      v_peak: ["用電"]
      v_unit: ["用電"]
      v_rt_10min: ["用電"]
      v_rt_daily: ["用電"]
  - topic: 電價與售電收入
    detail: 資料庫沒有任何電價、費率或售電金額欄位；成本只有分發電方式的每度成本。
    absent:
      v_system: ["電價", "費率", "售電"]
      v_peak: ["電價", "費率", "售電"]
      v_unit: ["電價", "費率", "售電"]
      v_outage: ["電價", "費率", "售電"]
      v_generation_cost: ["電價", "費率", "售電"]
      v_re_generation: ["電價", "費率", "售電"]
      v_rt_10min: ["電價", "費率", "售電"]
      v_rt_daily: ["電價", "費率", "售電"]
  - topic: 碳排放
    detail: 沒有碳排放量或排放係數；無法回答任何與碳足跡相關的問題。
    absent:
      v_system: ["碳", "排放"]
      v_peak: ["碳", "排放"]
      v_unit: ["碳", "排放"]
      v_outage: ["碳", "排放"]
      v_generation_cost: ["碳", "排放"]
      v_re_generation: ["碳", "排放"]
      v_rt_10min: ["碳", "排放"]
      v_rt_daily: ["碳", "排放"]
  - topic: 兩週以前比「日」更細的時間粒度
    detail: >-
      歷史快照最細到日。每 10 分鐘的即時明細只保留最近 14 天，更早的日子只剩每日彙總，
      無法回答兩週以前某一天之內的變化。
    absent:
      v_system: ["小時", "時段", "分鐘"]
      v_peak: ["小時", "時段", "分鐘"]
      v_rt_daily: ["小時", "時段", "分鐘", "時刻"]
