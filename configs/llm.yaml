# 長尾問句交給哪一種本機模型。只有本機的 Ollama（https://ollama.com），不需要 API key，
# 問句與資料都不會離開這台機器。值必須是 providers 底下的一個鍵，填別的會在建 runtime 時
# 就失敗，不會默默退回某個預設 —— 打錯名字而服務照常啟動是最難查的那種錯。
# 環境變數 POWERQUERY_LLM_PROVIDER 優先於這裡。
provider: ollama

max_attempts: 3

# 每種模式一段：
#
#   base_url   Ollama 的 OpenAI 相容端點。Ollama 在別台機器上就改這裡。
#   structured_output
#              模型吃不吃 strict 的 json_schema。關掉之後輸出格式只剩 prompt 裡的要求，
#              靠 parse_generated_query 的寬容解析接住；生出來的東西一樣要過 SqlGuard，
#              所以放寬的是格式保證，不是安全。
#   temperature
#              固定 0。同一個問句每次生出不同 SQL，評測會失去意義。
#
# 用法：`ollama pull qwen3:8b`，再到管理頁「本機 LLM」把執行模式切到本機 LLM（或自動）。
# 換模型用 OLLAMA_MODEL。
#
# 兩種模式，同一個模型，差在推理（thinking）開不開。數字來自 eval.llm_eval：規則接不住的 20 題，
# 都有答案檢查（log.md CP-088～090）：
#   ollama            推理關：答對 6/20，每題中位數 11 秒、最慢 23 秒，不會逾時。預設用這個。
#   ollama-reasoning  推理開：答對 10/20，每題中位數約 6 分鐘，7 題 900 秒內寫不完。
providers:
  ollama:
    base_url: http://127.0.0.1:11434/v1
    model_env: OLLAMA_MODEL
    default_model: qwen3:8b
    structured_output: true
    temperature: 0
    request_timeout_seconds: 120
    # Ollama 0.40 的 OpenAI 相容端點認 reasoning_effort: none（think: false 不認）；
    # 實測同一個問題 161 秒、2432 tokens → 18 秒、327 tokens。
    extra_body:
      reasoning_effort: none

  ollama-reasoning:
    base_url: http://127.0.0.1:11434/v1
    model_env: OLLAMA_MODEL
    default_model: qwen3:8b
    structured_output: true
    temperature: 0
    # 推理開著時，答得出來的題目最慢約 8 分鐘；更久的通常是推理停不下來，等再久也沒用。
    request_timeout_seconds: 600
