top_k: 5
# 檢索門檻。實測走到檢索的 27 題、135 個範例對：意圖相符的分數中位數 0.118（最高
# 0.462），不相符的中位數 0.053（最高 0.303）—— 兩個分佈重疊，沒有任何門檻切得開。
# 所以這兩個數字不是用來「找出相關範例」，只是砍掉明顯的雜訊：
#   無門檻          相符 39 / 不符 96，純度 29%
#   min 0.05        相符 33 / 不符 51，純度 39%
#   ＋ relative 0.5 相符 28 / 不符 27，純度 51%，只有 1/27 題變成沒有範例
# 純度 51% 仍然不高，那是字元 n-gram 只懂字面的極限，換語意向量才會有本質改善。
min_score: 0.05
relative_score: 0.5
character_ngram:
  min: 2
  max: 4

