# 每日供需資料（B 檔）中 21 個沒有機組主檔的欄位，各自到哪裡取裝置容量。
#
# 對照是逐欄明寫的，不是用字串比對推出來的。理由：前綴比對會把「台中#1」配到
# 「台中#10」，把「大林(#5-#6)」配到「大林#1」。這 21 欄一次寫清楚，之後改分類
# 只要改這個檔，不動程式。
#
# source 的三種值：
#   nuclear           —— 資料集 10858（核能發電廠位置及機組設備，d056001）。
#                        這是主檔，「有異動時」才更新，數值穩定。
#   realtime          —— 資料集 8931（各機組發電量即時資訊，d006001）的逐機組列。
#   realtime_subtotal —— 8931 的小計列，對應的是全系統彙總欄位。
#   unavailable       —— 目前沒有可引用的來源，容量留 NULL 並記錄原因。
#
# realtime 是每 10 分鐘覆寫的快照，不是主檔：機組除役後會直接從清單消失
# （麥寮就是這樣消失的）。因此每次建庫都會把當次快照的 SHA-256 記進
# capacity_source，容量是哪一刻的狀態可以回溯。

columns:
  # ── 核能：6 欄，全部來自主檔 ──────────────────────────────
  "核一#1": {source: nuclear, plant: 核一廠, unit: 一號機}
  "核一#2": {source: nuclear, plant: 核一廠, unit: 二號機}
  "核二#1": {source: nuclear, plant: 核二廠, unit: 一號機}
  "核二#2": {source: nuclear, plant: 核二廠, unit: 二號機}
  "核三#1": {source: nuclear, plant: 核三廠, unit: 一號機}
  "核三#2": {source: nuclear, plant: 核三廠, unit: 二號機}

  # ── 民營電廠單機：8931 有同名機組 ────────────────────────
  "和平#1": {source: realtime, units: [和平#1]}
  "和平#2": {source: realtime, units: [和平#2]}
  "新桃#1": {source: realtime, units: [新桃#1]}
  "星元#1": {source: realtime, units: [星元#1]}
  "星彰#1": {source: realtime, units: [星彰#1]}
  # B 欄位名稱中間有一個空格，是官方原檔的寫法，不要順手改掉。
  "國光 #1": {source: realtime, units: [國光#1]}

  # ── 民營電廠彙總：把該廠在 8931 的機組相加 ───────────────
  "嘉惠(#1~#2)": {source: realtime, units: [嘉惠#1, 嘉惠#2]}
  "海湖 (#1-#2)": {source: realtime, units: [海湖#1, 海湖#2]}
  "豐德(#1-#3)": {source: realtime, units: [豐德#1, 豐德#2, 豐德#3]}

  # ── 全系統彙總欄：對應 8931 的小計列 ─────────────────────
  汽電共生: {source: realtime_subtotal, fuel: 汽電共生}
  風力發電: {source: realtime_subtotal, fuel: 風力}
  太陽能發電: {source: realtime_subtotal, fuel: 太陽能}

  # ── 目前補不到的 ────────────────────────────────────────
  # 麥寮的購售電合約機組已從 8931 的即時清單移除（2026-09-18 快照的
  # 民營電廠-燃煤只剩和平 #1、#2），台電簡明月報表 4-1／4-3 又只按能源別
  # 彙總、沒有逐廠容量。每日資料仍保留這三個歷史欄位，因此容量留 NULL，
  # 不從第三方網站或舊快照臆測。
  "麥寮#1": {source: unavailable, note: 8931 即時清單已無此機組，月報亦無逐廠容量}
  "麥寮#2": {source: unavailable, note: 8931 即時清單已無此機組，月報亦無逐廠容量}
  "麥寮#3": {source: unavailable, note: 8931 即時清單已無此機組，月報亦無逐廠容量}
