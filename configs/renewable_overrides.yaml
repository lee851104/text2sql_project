# 再生能源兩份開放資料（17141 場址主檔、17140 月發電量）的人工裁決。
#
# 程式不猜測對應與數值；自動規則處理不了的，一律寫在這裡並附上判斷依據，
# 沒有寫在這裡的就維持未對齊或不列入加總。

# 發電量檔（17140）的發電站名稱 -> 場址主檔（17141）的發電站名稱。
# 兩邊都先做過正規化（取中文側、去掉結尾「發電站」）後才比對。
station_aliases:
  # 17141：高訓中心太陽光電發電站，3 個場址（高訓實習大樓 112 瓩、
  # 高訓教學綜合大樓 100 瓩、高訓活動中心 158 瓩），同一地址高雄市大寮區華西路 41 號。
  # 17140：高訓中心光電，26 個月累計 1,055,393 度。
  # 依據：以合計 370 瓩推算容量因數 15.0%，落在台灣屋頂光電的合理範圍。
  高訓中心光電: 高訓中心太陽光電

  # 17141：龜山第三加壓站太陽光電發電站，307 瓩，桃園市龜山區忠義路 2 段 366 號。
  # 17140：龜山加壓站太陽光電，31 個月累計 877,151 度。
  # 依據：容量因數 12.6%，且地名與類型一致，僅少了「第三」二字。
  龜山加壓站太陽光電: 龜山第三加壓站太陽光電

# 發電量檔（17140）中前綴是數字、但尾隨無法解釋字元的儲存格。
# key 是原始字串，value 是人工確認後的度數。未列在這裡的 suspect 值不列入加總。
generation_repairs:
  # 澎湖湖西風力 2024-07。原始值尾端多一個「2」。
  # 依據：台電 11307 簡明月報表 2-2，澎湖湖西風力發電站 #1~#6 毛發電量
  # 114,194 + 104,459 + 41,294 + 16,335 + 27,752 + 78,688 = 382,722 度，
  # 站級廠用電量 25,566 度，382,722 - 25,566 = 357,156 度，與月報列印的
  # 淨發電量 357,156.00 完全相符。
  "357,156.00 2": 357156
