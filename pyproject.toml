[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "powerquery-tw"
version = "0.3.0"
description = "Trustworthy Text2SQL for Taiwan Power Company open data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "certifi>=2025,<2028",
    "fastapi>=0.141,<1",
    "PyYAML>=6.0,<7",
    "sqlglot>=27,<29",
    "uvicorn>=0.52,<1",
]

[project.optional-dependencies]
online = ["openai>=1.100,<3"]
dev = [
    "httpx2>=2.12,<3",
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[project.scripts]
powerquery = "cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["cli"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "contract: public-interface contract tests",
    "integration: multi-module integration tests",
    "e2e: end-to-end tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["taipower_align"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
